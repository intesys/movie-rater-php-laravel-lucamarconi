services:

    app:
        container_name: '${PROJECT_NAME}-php'
        environment:
            TZ: '${TZ}'
        networks:
            - 'app-network'

    webserver:
        container_name: '${PROJECT_NAME}-web'
        depends_on:
            - app
        ports:
            - '${WEBSERVER_EXTERNAL_PORT}:80'
        environment:
            TZ: '${TZ}'
        networks:
            - 'app-network'

networks:
    app-network:
        name: '${PROJECT_NAME}-network'
        driver: bridge
